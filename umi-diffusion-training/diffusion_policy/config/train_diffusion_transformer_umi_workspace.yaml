defaults:
  - _self_

name: train_diffusion_transformer_timm
_target_: diffusion_policy.workspace.train_diffusion_transformer_timm_workspace.TrainDiffusionTransformerTimmWorkspace

# --- [手动补全：Task 核心参数定义] ---
task:
  name: umi
  # --- [新增：位姿表征定义] ---
  pose_repr:
    obs_pose_repr: relative
    action_pose_repr: relative
  # --- [新增：在这里添加 dataset 定义] ---
  dataset:
    dataset_path: "data/umi_dataset"
  shape_meta: &shape_meta
    obs:
      camera0_rgb:
        shape: [3, 224, 224]
        type: rgb
        horizon: 2
      robot0_eef_pos:
        shape: [3]
        type: low_dim
        horizon: 2
      # --- [修正：改为 6 维 Rotation 6D 表示] ---
      robot0_eef_rot_axis_angle:
        shape: [6]
        type: low_dim
        horizon: 2
      robot0_gripper_width:
        shape: [1]
        type: low_dim
        horizon: 2
      # --- [修正：改为 6 维 Rotation 6D 表示] ---
      robot0_eef_rot_axis_angle_wrt_start:
        shape: [6]
        type: low_dim
        horizon: 2
    action:
      shape: [10]
      horizon: 16

task_name: umi
shape_meta: *shape_meta
exp_name: "default"

n_action_steps: 8
n_emb: 768

policy:
  _target_: diffusion_policy.policy.diffusion_transformer_timm_policy.DiffusionTransformerTimmPolicy

  shape_meta: *shape_meta
  
  noise_scheduler:
    _target_: diffusers.DDIMScheduler
    num_train_timesteps: 50
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: True
    set_alpha_to_one: True
    steps_offset: 0
    prediction_type: epsilon

  obs_encoder:
    _target_: diffusion_policy.model.vision.transformer_obs_encoder.TransformerObsEncoder
    shape_meta: *shape_meta
    global_pool: ''
    n_emb: 768
    # --- [修复：删除所有重复和注释的 model_name，只保留这一个] ---
    model_name: 'vit_base_patch16_clip_224.openai'
    pretrained: True
    frozen: False
    feature_aggregation: null
    downsample_ratio: 32
    use_group_norm: True
    share_rgb_model: False

    transforms:
      - type: RandomCrop
        ratio: 0.95
      - _target_: torchvision.transforms.RandomRotation
        degrees: [-5.0, 5.0]
        expand: false
      - _target_: torchvision.transforms.ColorJitter
        brightness: 0.3
        contrast: 0.4
        saturation: 0.5
        hue: 0.08

  num_inference_steps: 16
  input_pertub: 0.1
  n_layer: 7
  n_head: 8
  n_emb: 768
  p_drop_attn: 0.1

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: True

val_dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: True

optimizer:
  lr: 3.0e-4
  weight_decay: 1.0e-6
  obs_encoder_lr: 3.0e-5
  obs_encoder_weight_decay: 1.0e-6
  betas: [0.95, 0.999]
  
training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: False
  # optimization
  lr_scheduler: cosine
  lr_warmup_steps: 2000
  num_epochs: 200
  gradient_accumulate_every: 1
  # EMA destroys performance when used with BatchNorm
  # replace BatchNorm with GroupNorm.
  use_ema: True
  freeze_encoder: False
  # training loop control
  # in epochs
  rollout_every: 10
  checkpoint_every: 10
  val_every: 1
  sample_every: 5
  # steps per epoch
  max_train_steps: null
  max_val_steps: null
  # misc
  tqdm_interval_sec: 1.0

logging:
  project: umi
  resume: False
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: train_loss
    mode: min
    k: 20
    format_str: 'epoch={epoch:04d}-train_loss={train_loss:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
