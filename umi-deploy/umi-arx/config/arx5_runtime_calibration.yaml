# Runtime calibration used by umi-arx/scripts/eval_arx5.py.
#
# Directions follow the repo convention:
#   tx_a_b == T_a_b, pose of frame b expressed in frame a.
#
# The action branch uses camera-frame policy outputs:
#   T_base_camera = T_base_arx_tcp @ T_arx_tcp_camera
#   T_base_policy_tcp_target = T_base_camera @ T_camera_policy_tcp_target
#   T_base_arx_tcp_target = T_base_policy_tcp_target @ inv(T_arx_tcp_policy_tcp)
#
# tx_policy_tcp_from_arx_tcp is derived as:
#   T_arx_tcp_policy_tcp = T_arx_tcp_camera @ T_camera_policy_tcp
action_reference_frame: camera

